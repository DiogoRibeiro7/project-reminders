[tool.poetry]
name = "project-reminders"
version = "0.1.0"
description = "Local-first lifecycle and engineering-health tracker for code projects"
authors = ["Diogo Ribeiro <diogo_dj@hotmail.com>"]
readme = "README.md"
packages = [{ include = "project_reminders", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = ">=0.115,<1"
jinja2 = ">=3.1,<4"
uvicorn = ">=0.34,<1"

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28,<1"
mypy = ">=1.15,<2"
pytest = ">=8,<10"
ruff = ">=0.11,<1"

[tool.poetry.scripts]
project-reminders = "project_reminders.cli:main"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
