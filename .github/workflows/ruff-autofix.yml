name: One-shot Ruff autofix

on:
  push:
    branches:
      - chore/ruff-baseline-cleanup

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ruff-baseline-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pip install poetry
      - name: Install project
        run: poetry install --no-interaction
      - name: Apply Ruff fixes and formatting
        run: |
          poetry run ruff check . --fix || true
          poetry run ruff format .
          poetry run ruff check . || true
      - name: Commit mechanical cleanup
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add .
          git commit -m "style: normalize Ruff baseline"
          git push origin HEAD:chore/ruff-baseline-cleanup
