name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pip install poetry
      - name: Install project
        run: poetry install --no-interaction
      - name: Ruff
        run: poetry run ruff check .
      - name: Mypy
        run: poetry run mypy .
      - name: Tests
        run: poetry run pytest
