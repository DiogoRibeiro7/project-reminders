name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-poetry@v1
        with:
          python-version: "3.13"
          install-deps: "false"
      - name: Install project
        run: poetry install --no-interaction
      - name: Validate project metadata
        run: poetry run python scripts/validate_project_metadata.py
      - name: Ruff
        run: poetry run ruff check .
      - name: Mypy
        run: poetry run mypy .
      - name: Tests
        run: poetry run pytest
