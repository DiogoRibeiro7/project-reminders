name: Fix board sync line

on:
  push:
    branches:
      - feat/sync-code-project-board
    paths:
      - .github/workflows/fix-board-sync-line.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sync-code-project-board
      - name: Wrap long typing line
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/sync_project_board.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '    raw_fields_value = fields_connection.get("nodes") if isinstance(fields_connection, dict) else None\n',
              '    raw_fields_value = (\n'
              '        fields_connection.get("nodes") if isinstance(fields_connection, dict) else None\n'
              '    )\n',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit line wrap
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add scripts/sync_project_board.py
          git commit -m "style: wrap board synchronizer typing line"
          git push origin HEAD:feat/sync-code-project-board
