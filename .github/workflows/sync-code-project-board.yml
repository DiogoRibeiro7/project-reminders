name: Sync Code Projects board

on:
  push:
    branches:
      - main
    paths:
      - data/projects.json
      - data/github_project.json
      - scripts/sync_project_board.py
      - scripts/project_metric_fields.py
      - scripts/sync_project_state.py
      - scripts/ensure_unclassified_board_option.py
      - scripts/ensure_project_views.py
      - src/project_reminders/application/board_inventory.py
      - src/project_reminders/application/board_markers.py
      - src/project_reminders/application/board_metrics.py
      - src/project_reminders/application/project_views.py
      - .github/workflows/sync-code-project-board.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-project-board-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Ensure unclassified lifecycle option
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PYTHONPATH: src
        run: python scripts/ensure_unclassified_board_option.py
      - name: Synchronize Project state
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PYTHONPATH: src:.
        run: python scripts/sync_project_state.py
      - name: Ensure managed project views
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PYTHONPATH: src
        run: python scripts/ensure_project_views.py
