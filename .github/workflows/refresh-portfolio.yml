name: Refresh portfolio state

on:
  push:
    branches:
      - ops/refresh-portfolio-state
    paths:
      - .github/workflows/refresh-portfolio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/refresh-portfolio-state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pip install poetry
      - name: Install project
        run: poetry install --no-interaction
      - name: Assess engineering health
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/project_ids.txt
          import json
          from pathlib import Path

          payload = json.loads(Path("data/projects.json").read_text(encoding="utf-8"))
          for project in payload["projects"]:
              print(project["id"])
          PY
          failures=0
          while IFS= read -r project_id; do
            if ! poetry run project-reminders assess "$project_id" --write; then
              echo "Assessment unavailable for $project_id"
              failures=$((failures + 1))
            fi
          done < /tmp/project_ids.txt
          echo "Assessment failures: $failures"
      - name: Observe GitHub operational state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: poetry run project-reminders observe --write || true
      - name: Commit refreshed portfolio
        run: |
          if git diff --quiet -- data/projects.json; then
            echo "No portfolio changes"
            exit 0
          fi
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data/projects.json
          git commit -m "data: refresh portfolio health and operational state"
          git push origin HEAD:ops/refresh-portfolio-state
