name: Fix board sync lint

on:
  push:
    branches:
      - feat/sync-code-project-board
    paths:
      - .github/workflows/fix-board-sync-lint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sync-code-project-board
      - name: Remove obsolete Ruff suppression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/sync_project_board.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(" as response:  # noqa: S310", " as response:")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add scripts/sync_project_board.py
          git commit -m "fix: remove obsolete Ruff suppression"
          git push origin HEAD:feat/sync-code-project-board
