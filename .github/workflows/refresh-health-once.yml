name: Refresh health once

on:
  push:
    branches:
      - ops/refresh-health-after-assessor-fix
    paths:
      - .github/workflows/refresh-health-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/refresh-health-after-assessor-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: pip install poetry
      - name: Install project
        run: poetry install --no-interaction
      - name: Reassess tracked repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/project_ids.txt
          import json
          from pathlib import Path

          payload = json.loads(Path('data/projects.json').read_text(encoding='utf-8'))
          for project in payload['projects']:
              print(project['id'])
          PY

          : > /tmp/assessment_failures.txt
          while IFS= read -r project_id; do
            echo "Assessing $project_id"
            if ! poetry run project-reminders assess "$project_id" --write; then
              echo "$project_id" >> /tmp/assessment_failures.txt
            fi
          done < /tmp/project_ids.txt

          failure_count=$(wc -l < /tmp/assessment_failures.txt)
          echo "ASSESSMENT_FAILURE_COUNT=$failure_count"
          if [ "$failure_count" -gt 0 ]; then
            echo "Assessment failures (preserved unchanged):"
            cat /tmp/assessment_failures.txt
          fi
      - name: Commit refreshed health
        run: |
          if git diff --quiet -- data/projects.json; then
            echo "No health changes"
            exit 0
          fi
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data/projects.json
          git commit -m "data: refresh health after assessor fix"
          git push origin HEAD:ops/refresh-health-after-assessor-fix
