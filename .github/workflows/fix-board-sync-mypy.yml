name: Fix board sync mypy

on:
  push:
    branches:
      - feat/sync-code-project-board
    paths:
      - .github/workflows/fix-board-sync-mypy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sync-code-project-board
      - name: Tighten GraphQL response typing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/sync_project_board.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '''    result = data.get("createProjectV2Field")\n    if not isinstance(result, dict) or not isinstance(result.get("projectV2Field"), dict):\n        raise RuntimeError(f"GitHub did not return created field {spec.name!r}")\n    return result["projectV2Field"]\n''',
              '''    result = data.get("createProjectV2Field")\n    if not isinstance(result, dict):\n        raise RuntimeError(f"GitHub did not return created field {spec.name!r}")\n    created_field = result.get("projectV2Field")\n    if not isinstance(created_field, dict):\n        raise RuntimeError(f"GitHub did not return created field {spec.name!r}")\n    return created_field\n''',
          )
          text = text.replace(
              '''    result = data.get("updateProjectV2Field")\n    if not isinstance(result, dict) or not isinstance(result.get("projectV2Field"), dict):\n        raise RuntimeError(f"GitHub did not return updated field {spec.name!r}")\n    return result["projectV2Field"]\n''',
              '''    result = data.get("updateProjectV2Field")\n    if not isinstance(result, dict):\n        raise RuntimeError(f"GitHub did not return updated field {spec.name!r}")\n    updated_field = result.get("projectV2Field")\n    if not isinstance(updated_field, dict):\n        raise RuntimeError(f"GitHub did not return updated field {spec.name!r}")\n    return updated_field\n''',
          )
          text = text.replace(
              '''    fields_connection = board.get("fields")\n    raw_fields = fields_connection.get("nodes") if isinstance(fields_connection, dict) else []\n    fields = [field for field in raw_fields if isinstance(field, dict)]\n''',
              '''    fields_connection = board.get("fields")\n    raw_fields_value = fields_connection.get("nodes") if isinstance(fields_connection, dict) else None\n    raw_fields = raw_fields_value if isinstance(raw_fields_value, list) else []\n    fields = [field for field in raw_fields if isinstance(field, dict)]\n''',
          )
          text = text.replace(
              '''    items_connection = board.get("items")\n    raw_items = items_connection.get("nodes") if isinstance(items_connection, dict) else []\n    managed: dict[str, JsonObject] = {}\n''',
              '''    items_connection = board.get("items")\n    raw_items_value = items_connection.get("nodes") if isinstance(items_connection, dict) else None\n    raw_items = raw_items_value if isinstance(raw_items_value, list) else []\n    managed: dict[str, JsonObject] = {}\n''',
          )
          text = text.replace(
              '''    item = result.get("projectItem")\n    if not isinstance(item, dict) or not isinstance(item.get("id"), str):\n        raise RuntimeError(f"Could not read board item ID for {project['name']}")\n    return item["id"]\n''',
              '''    item = result.get("projectItem")\n    if not isinstance(item, dict):\n        raise RuntimeError(f"Could not read board item ID for {project['name']}")\n    item_id = item.get("id")\n    if not isinstance(item_id, str):\n        raise RuntimeError(f"Could not read board item ID for {project['name']}")\n    return item_id\n''',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit typing fixes
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add scripts/sync_project_board.py
          git commit -m "fix: tighten board synchronizer typing"
          git push origin HEAD:feat/sync-code-project-board
