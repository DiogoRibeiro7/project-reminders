name: Dedupe Code Projects board once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dedupe-code-project-board-once.yml

permissions:
  contents: read

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Archive legacy duplicate cards
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PYTHONPATH: src
        run: python scripts/dedupe_project_board.py
