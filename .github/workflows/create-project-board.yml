name: Create project board

on:
  push:
    branches:
      - ops/create-github-project-board
    paths:
      - .github/workflows/create-project-board.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-board:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/create-github-project-board
      - name: Ensure GitHub Projects board exists
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "${PROJECT_TOKEN:-}" ]; then
            echo "PROJECT_TOKEN is not configured"
            exit 1
          fi
          export GH_TOKEN="$PROJECT_TOKEN"

          query='query($login:String!){user(login:$login){id projectsV2(first:100){nodes{id number title url closed}}}}'
          response=$(gh api graphql -f query="$query" -F login=DiogoRibeiro7)
          owner_id=$(printf '%s' "$response" | jq -r '.data.user.id')
          row=$(printf '%s' "$response" | jq -r '.data.user.projectsV2.nodes[] | select(.title == "Code Projects" and .closed == false) | [.id, (.number|tostring), .url] | @tsv' | head -n 1)

          if [ -z "$row" ]; then
            mutation='mutation($owner:ID!,$title:String!){createProjectV2(input:{ownerId:$owner,title:$title}){projectV2{id number url}}}'
            row=$(gh api graphql -f query="$mutation" -F owner="$owner_id" -F title='Code Projects' --jq '.data.createProjectV2.projectV2 | [.id, (.number|tostring), .url] | @tsv')
            echo "Created Code Projects board"
          else
            echo "Found existing Code Projects board"
          fi

          IFS=$'\t' read -r project_id project_number project_url <<< "$row"
          export PROJECT_ID="$project_id"
          export PROJECT_NUMBER="$project_number"
          export PROJECT_URL="$project_url"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "owner": "DiogoRibeiro7",
              "title": "Code Projects",
              "number": int(os.environ["PROJECT_NUMBER"]),
              "url": os.environ["PROJECT_URL"],
              "node_id": os.environ["PROJECT_ID"],
          }
          Path("data/github_project.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          echo "PROJECT_NUMBER=$project_number"
          echo "PROJECT_URL=$project_url"
      - name: Commit board binding
        run: |
          if git diff --quiet -- data/github_project.json; then
            echo "Board binding unchanged"
            exit 0
          fi
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data/github_project.json
          git commit -m "config: bind code portfolio to GitHub Project"
          git push origin HEAD:ops/create-github-project-board
