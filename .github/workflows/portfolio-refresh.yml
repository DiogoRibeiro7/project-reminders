name: Refresh Code Portfolio

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

concurrency:
  group: code-portfolio-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pip install poetry
      - name: Install project
        run: poetry install --no-interaction
      - name: Refresh engineering and operational evidence
        env:
          PROJECT_SCAN_TOKEN: ${{ secrets.PROJECT_SCAN_TOKEN }}
        run: poetry run python scripts/refresh_portfolio.py
      - name: Commit refreshed portfolio state
        id: commit
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data/projects.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Portfolio state is unchanged"
          else
            git commit -m "data: refresh code portfolio evidence"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Synchronize GitHub Project board
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: poetry run python scripts/sync_project_board.py
